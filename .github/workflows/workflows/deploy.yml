name: Deploy to Azure Function

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: "funcMysteryShopper"
  PYTHON_VERSION: "3.12"   # keep the same as the Python version in Function App > Settings > Configuration > Stack settings

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # App Service plan (B1): normal deploy, Azure installs requirements.txt itself.
      # (sku: flexconsumption / remote-build are only for Flex Consumption apps.)
      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: .
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
